name: CI

# 为什么补这个文件（2026-10-27）：
#   另外两个主项目（api-test-platform / office-oa）早就有 CI 做回归，只有这个没有 ——
#   于是「单测全绿」这件事全靠本地手动跑，一旦改了 RAG 的切块或检索，没人拦。
#
# 这个仓库的三层是：
#   ① 安装依赖（lock 已提交，用 npm ci 保证和本地一致）
#   ② 单测 + 覆盖率（vitest，100 条：切块 / 向量 / 检索 / 存储 / Agent / 业务路由 / 模型调用层）
#   ③ 构建（vite build —— Vercel 上部署的就是它，构建失败等于线上发不出去）
#
# 覆盖率是**基线锁**（vitest.config.js 里的 thresholds），不是"达标线"：
#    2026-10-27 实测 statements 53.54% / branches 41.87% / functions 53.06% / lines 54.83%。
#    阈值取实测值向下取整，作用是「不许偷偷往下掉」；往上补才是正经活，改阈值假装达标不算。
#    未覆盖的主要是 hotlistSource（测试里打桩）与几个次要路由，不是 Agent 主链路。
#
# ⚠️ tests/ 里还有 pytest（test_topics.py 等），本机装不上依赖（缺 _socket），
#    一直没跑过 —— 所以刻意不放进 CI：宁可"没有"，也不要做一条从没绿过的假门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ① 装依赖
        # --legacy-peer-deps 不是随手加的旗标，是这个依赖树的必需品：
        # 裸 `npm ci` 会死在 npm 10.9.x arborist 的
        # 「Cannot read properties of null (reading 'edgesOut')」上（本地 npm 10.9.7 稳定复现，
        # CI 第 1 次运行就挂在这一步、6 秒退出）。加上它只是跳过 peer 冲突检查，
        # 装出来的版本与本地开发环境一致 —— 不加的话这条流水线根本起不来。
        run: npm ci --legacy-peer-deps

      - name: ② 单测 + 覆盖率（基线锁，掉下来就红）
        run: npm run test:cov

      - name: ③ 构建（Vercel 部署的产物就是它）
        run: npm run build

      - name: 覆盖率报告（留档，方便回看趋势）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore
